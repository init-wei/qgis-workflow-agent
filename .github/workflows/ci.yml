name: CI
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-smoke:
    name: Backend and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.5'
      - run: uv sync --locked
      - run: uv run --locked python -m compileall -q agent qgis_mcp_server ui/backend scripts
      - run: uv run --locked ruff check .
      - run: uv run --locked python scripts/check_docs.py
      - run: uv run --locked pytest
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  frontend-types:
    name: Frontend types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
